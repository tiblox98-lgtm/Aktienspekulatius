<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Aktienspekulatius</title>
<style>
  body{
    margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    font-family:'Segoe UI',Arial,sans-serif;color:#e2e8f0;text-align:center;
  }
  h1{font-size:28px;margin-bottom:8px;}
  p{color:#94a3b8;font-size:14px;margin-bottom:32px;}
  img{
    width:260px;max-width:70vw;cursor:pointer;transition:transform 0.25s ease, filter 0.25s ease;
    filter:drop-shadow(0 0 20px rgba(56,189,248,0.25));
  }
  img:hover{transform:scale(1.08) rotate(-2deg);filter:drop-shadow(0 0 30px rgba(56,189,248,0.5));}
  .hint{margin-top:24px;font-size:12px;color:#64748b;}
</style>
</head>
<body>
  <h1>🍪 Aktienspekulatius</h1>
  <p>Klicke auf den Spekulatius, um zur Watchlist zu gelangen</p>
  <a href="uebersicht.html">
    <img src="logo.png" alt="Zur Watchlist">
  </a>
  <div class="hint">Automatisch aktualisierte Kurse &amp; Alarme via GitHub Actions</div>
</body>
</html>
